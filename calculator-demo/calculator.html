<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OctoCode Calculator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
.calculator { background: #16213e; border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 340px; }
.display { background: #0f3460; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: right; min-height: 80px; display: flex; flex-direction: column; justify-content: flex-end; }
.display .expression { color: #8899aa; font-size: 14px; min-height: 20px; word-break: break-all; }
.display .result { color: #e94560; font-size: 36px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
button { border: none; border-radius: 10px; padding: 18px; font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
button:active { transform: scale(0.95); }
.btn-number { background: #1a1a40; color: #fff; }
.btn-number:hover { background: #2a2a50; }
.btn-op { background: #e94560; color: #fff; }
.btn-op:hover { background: #ff6b81; }
.btn-func { background: #533483; color: #fff; }
.btn-func:hover { background: #6b44a0; }
.btn-equal { background: #00b4d8; color: #fff; }
.btn-equal:hover { background: #48cae4; }
.btn-zero { grid-column: span 2; }
h2 { color: #e94560; text-align: center; margin-bottom: 16px; font-size: 14px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="calculator">
<h2>OCTOCODE CALCULATOR</h2>
<div class="display">
  <div class="expression" id="expression"></div>
  <div class="result" id="result">0</div>
</div>
<div class="buttons">
  <button class="btn-func" onclick="clearAll()">AC</button>
  <button class="btn-func" onclick="toggleSign()">+/-</button>
  <button class="btn-func" onclick="percentage()">%</button>
  <button class="btn-op" onclick="setOp('/')">÷</button>
  <button class="btn-number" onclick="appendDigit('7')">7</button>
  <button class="btn-number" onclick="appendDigit('8')">8</button>
  <button class="btn-number" onclick="appendDigit('9')">9</button>
  <button class="btn-op" onclick="setOp('*')">×</button>
  <button class="btn-number" onclick="appendDigit('4')">4</button>
  <button class="btn-number" onclick="appendDigit('5')">5</button>
  <button class="btn-number" onclick="appendDigit('6')">6</button>
  <button class="btn-op" onclick="setOp('-')">−</button>
  <button class="btn-number" onclick="appendDigit('1')">1</button>
  <button class="btn-number" onclick="appendDigit('2')">2</button>
  <button class="btn-number" onclick="appendDigit('3')">3</button>
  <button class="btn-op" onclick="setOp('+')">+</button>
  <button class="btn-number btn-zero" onclick="appendDigit('0')">0</button>
  <button class="btn-number" onclick="appendDot()">.</button>
  <button class="btn-equal" onclick="calculate()">=</button>
</div>
</div>
<script>
let current = '0', previous = '', operator = '', resetNext = false;
const display = document.getElementById('result');
const expr = document.getElementById('expression');
function updateDisplay() { display.textContent = current; }
function appendDigit(d) {
  if (resetNext) { current = ''; resetNext = false; }
  if (current === '0' && d !== '.') current = '';
  current += d;
  if (current.length > 15) current = current.slice(0, 15);
  updateDisplay();
}
function appendDot() {
  if (resetNext) { current = '0'; resetNext = false; }
  if (!current.includes('.')) current += '.';
  updateDisplay();
}
function setOp(op) {
  if (operator && !resetNext) calculate();
  previous = current;
  operator = op;
  expr.textContent = previous + ' ' + {'/':'÷','*':'×','-':'−','+':'+'}[op];
  resetNext = true;
}
function calculate() {
  if (!operator || !previous) return;
  const a = parseFloat(previous), b = parseFloat(current);
  let r;
  switch(operator) {
    case '+': r = a + b; break;
    case '-': r = a - b; break;
    case '*': r = a * b; break;
    case '/': r = b === 0 ? 'Error' : a / b; break;
  }
  expr.textContent = previous + ' ' + {'/':'÷','*':'×','-':'−','+':'+'}[operator] + ' ' + current + ' =';
  current = typeof r === 'number' ? parseFloat(r.toFixed(10)).toString() : r;
  operator = ''; previous = '';
  resetNext = true;
  updateDisplay();
}
function clearAll() { current = '0'; previous = ''; operator = ''; expr.textContent = ''; updateDisplay(); }
function toggleSign() { current = (parseFloat(current) * -1).toString(); updateDisplay(); }
function percentage() { current = (parseFloat(current) / 100).toString(); updateDisplay(); }
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
  else if (e.key === '.') appendDot();
  else if (['+','-','*','/'].includes(e.key)) setOp(e.key);
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape') clearAll();
});
</script>
</body>
</html>
