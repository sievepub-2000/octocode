# cargo-deny configuration — Octocode
#
# Run: `cargo deny check`
# CI gate: see .github/workflows/audit.yml

[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = [
    # gtk-rs 0.18 family is unmaintained but is the only stable WebKit2GTK
    # binding for our Linux desktop-shell. Windows/macOS use native WebView2 /
    # WebKit and do not pull these crates. Re-evaluate when `wry` upgrades to
    # gtk-rs 0.20.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429", # glib 0.18 VariantStrIter unsoundness; Linux-only
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained, transitive via gtk3-macros
    "RUSTSEC-2025-0057", # fxhash unmaintained, transitive via wry/selectors
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained; tracked for future swap
    "RUSTSEC-2017-0008", # serial unmaintained, transitive via portable-pty
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["Unicode-3.0"]
name = "unicode-ident"

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
