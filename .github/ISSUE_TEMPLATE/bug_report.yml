name: Bug report
description: Report a defect in Octocode runtime, providers, or WebUI.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach the output of `octocode-cli doctor` and the active provider id / base URL.
  - type: input
    id: version
    attributes:
      label: Octocode version
      placeholder: 2026.4.29
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: WebUI server log (logs/webui-*.log), browser console, or `octocode-cli doctor` output.
      render: shell
