name: Assemble verified 2.0.5 installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sievepub-2000/octocode
    steps:
      - name: Download temporary draft assets and assemble exact signed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir parts
          gh release download v2.0.5 --pattern 'OctoCodeSetup.exe.part-*' --dir parts
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(Path('parts').iterdir())
          assert [p.name for p in files] == [f'OctoCodeSetup.exe.part-{i:03d}' for i in range(18)]
          digest = hashlib.sha256()
          with open('OctoCodeSetup.exe', 'xb') as output:
              for index, part in enumerate(files):
                  assert part.stat().st_size == (48 * 1024 * 1024 if index < 17 else 13797688)
                  with part.open('rb') as source:
                      for data in iter(lambda: source.read(1024 * 1024), b''):
                          output.write(data)
                          digest.update(data)
          assert Path('OctoCodeSetup.exe').stat().st_size == 869435704
          assert digest.hexdigest() == 'ebbc5451cbcf2bf435b167c1139e6654c2bd8270f0bc266472e53cd1d79de7f6'
          print('Exact installer SHA-256 and size verified')
          PY
          gh release upload v2.0.5 OctoCodeSetup.exe
      - name: Verify canonical server asset before removing temporary parts
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sievepub-2000/octocode/releases/428344088/assets --paginate > assets.json
          python3 - <<'PY'
          import json
          import subprocess
          assets = json.load(open('assets.json'))
          canonical = [a for a in assets if a['name'] == 'OctoCodeSetup.exe']
          assert len(canonical) == 1
          asset = canonical[0]
          assert asset['state'] == 'uploaded' and asset['size'] == 869435704
          assert asset['digest'] == 'sha256:ebbc5451cbcf2bf435b167c1139e6654c2bd8270f0bc266472e53cd1d79de7f6'
          names = {f'OctoCodeSetup.exe.part-{i:03d}' for i in range(18)}
          parts = [a for a in assets if a['name'] in names]
          assert len(parts) == 18
          for part in parts:
              subprocess.run(['gh', 'api', '--method', 'DELETE', f"repos/sievepub-2000/octocode/releases/assets/{part['id']}"], check=True)
          print('Canonical asset verified; temporary parts removed')
          PY
