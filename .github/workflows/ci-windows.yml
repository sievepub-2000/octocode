name: ci-windows

# T8 (release-hardening): Windows-first CI gate.
# Linux/macOS targets are intentionally NOT built here per the
# project's current Windows-only validation policy. They can be
# re-enabled by adding entries to the `os` matrix below.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check / clippy / test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (no-fail-fast)
        run: cargo test --workspace --no-fail-fast

  release-build:
    name: cargo build --release octocode-cli (windows-latest)
    runs-on: windows-latest
    needs: check
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p octocode-cli
        run: cargo build --release -p octocode-cli

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: octocode-cli-windows-x86_64
          path: target/release/octocode-cli.exe
          if-no-files-found: error
          retention-days: 14
