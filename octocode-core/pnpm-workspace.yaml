packages:
  - "src" # Should be apps/vscode
  - "webview-ui" # Should be apps/vscode-webview
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": false
  "@vscode/ripgrep": true
  "@vscode/vsce-sign": true
  core-js: false
  esbuild: true
  keytar: false
  protobufjs: false

allowedDeprecatedVersions:
  "@ungap/structured-clone": "1.3.0"
  fstream: "1.0.12"
  lodash.isequal: "4.5.0"
  node-domexception: "1.0.0"
  prebuild-install: "7.1.3"
  rimraf: "2.7.1"
  uuid: "8.3.2"
  whatwg-encoding: "3.1.1"

minimumReleaseAgeExclude:
  - caniuse-lite@1.0.30001810

overrides:
  "@xmldom/xmldom@<0.8.15": "0.8.15"
  "@babel/core": "8.0.1"
  "@hono/node-server": "1.19.15"
  "@types/hast": "3.0.5"
  body-parser: "2.3.0"
  brace-expansion: "5.0.12"
  fast-uri: "3.1.8"
  hono: "4.13.7"
  ip-address: "10.7.1"
  js-yaml: "4.3.2"
  linkify-it: "5.0.2"
  markdown-it: "14.3.1"
  mdast-util-to-hast: "13.2.1"
  minimatch: "10.2.3"
  caniuse-lite: "1.0.30001810"
  nanoid: "3.3.18"
  path-to-regexp: "8.4.0"
  postcss: "8.5.23"
  protobufjs: "7.6.5"
  "proxy-addr@<2.0.8": "2.0.8"
  serialize-javascript: "7.0.5"
  "shell-quote@<1.11.0": "1.12.0"
  tmp: "0.2.7"
  uuid: "11.1.1"
  "eslint-plugin-react-hooks>zod-validation-error": "4.0.2"
  tar-fs: ">=3.1.1"
  esbuild: "0.28.1"
  rollup: "4.60.4"
  vite: "8.1.0"
  "undici@^6": "6.28.1"
  form-data: ">=4.0.4"
  bluebird: ">=3.7.2"
  glob: "13.0.6"
