[workspace]
members = [
    "crates/octocode-api",
    "crates/octocode-cli",
    "crates/octocode-commands",
    "crates/octocode-core",
    "crates/octocode-mcp",
    "crates/octocode-mock-provider",
    "crates/octocode-plugins",
    "crates/octocode-runtime",
    "crates/octocode-skills",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["周浩"]

[workspace.dependencies]
tao = "0.34"
wry = "0.53"
ureq = "2.12"
tungstenite = "0.24"
portable-pty = "0.8"
sha1_smol = "1.0"
sha1 = "0.10"
base64 = "0.22"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
crossterm = "0.28"
sha2 = "0.10"
tempfile = "3"

