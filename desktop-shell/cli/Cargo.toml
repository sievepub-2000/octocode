[package]
name = "code-cli"
version = "0.1.0"
edition = "2021"
default-run = "code"

[workspace]
members = ["vendor/tunnels"]
default-members = ["."]
exclude = ["vendor/russh", "vendor/ssh-key", "vendor/openssl-sys", "vendor/openssl-src"]

[patch.crates-io]
ssh-key = { path = "vendor/ssh-key" }
openssl-sys = { path = "vendor/openssl-sys" }

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "code"

[dependencies]
futures = "0.3.28"
clap = { version = "4.3.0", features = ["derive", "env"] }
open = "4.1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7.8", features = ["compat", "codec"] }
flate2 = { version = "1.0.26", default-features = false, features = ["zlib"] }
zip = { version = "9", default-features = false, features = ["time", "deflate-flate2-zlib"] }
regex = "1.8.3"
sysinfo = { version = "0.29.0", default-features = false }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
rmp-serde = "1.1.1"
uuid = { version = "1.4", features = ["serde", "v4"] }
dirs = "5.0.1"
rand = "0.8.6"
serde_bytes = "0.11.9"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
http = "1"
gethostname = "0.4.3"
libc = "0.2.144"
tunnels = { path = "vendor/tunnels", default-features = false, features = ["connections"] }
keyring-core = "1"
dialoguer = "0.10.4"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
indicatif = "0.18"
tempfile = "3.5.0"
clap_lex = "1"
url = "2.5.4"
log = "0.4.18"
const_format = "0.2.31"
sha2 = "0.10.6"
base64 = "0.22"
shell-escape = "0.1.5"
thiserror = "2"
cfg-if = "1.0.0"
pin-project = "1.1.0"
console = "0.15.7"
bytes = "1.11.1"
tar = "0.4.46"
local-ip-address = "0.6"
ahp = "0.4"
ahp-types = "0.4"

[build-dependencies]
serde = { version="1.0.163", features = ["derive"] }
serde_json = "1.0.96"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
winreg = "0.56"
winapi = "0.3.9"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
core-foundation = "0.9.3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-openssl", "vendored"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials"] }

[profile.release]
strip = true
lto = "thin"

[features]
default = []
vsda = []
vscode-encrypt = []
